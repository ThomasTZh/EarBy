[versions]
agp = "9.4.0"
kotlin = "2.4.20"
compose-bom = "2025.08.00"
activity = "1.12.0"
coroutines = "1.10.2"
lifecycle = "2.9.4"
media3 = "1.11.1"
navigation3 = "1.0.1"
datastore = "1.2.1"
serialization = "1.9.0"
ksp = "2.2.21-2.0.5"
jackson = "2.19.4"
sqlite-jdbc = "3.53.4.0"
junit = "4.13.2"
androidx-test-junit = "1.3.0"
androidx-test-runner = "1.7.0"
androidx-test-core = "1.7.0"
uiautomator = "2.3.0"
robolectric = "4.17"
roborazzi = "1.76.0"
spotless = "8.0.0"
ktlint = "1.7.1"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# Navigation 3 1.0.1 depends on Compose 1.9.5, a patch above the pinned Compose BOM 1.9.0.
# 1.2.0 would pull Compose 1.10.0, a minor upgrade outside this package's scope.
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
# Bounded structural preflight for imported documents: duplicate keys, nesting depth and string
# length are checked with a streaming parser rather than by hand-writing a tokenizer.
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
# Test-only SQLite engine. Production uses the platform's android.database.sqlite; the host tests
# exercise the same schema, migrations and SQL against the same engine family so a migration is
# tested on the host rather than only on a device.
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
# Host-rendered UI regression checks: Robolectric supplies the Android runtime and Roborazzi
# captures the composable output. Test-only; the app gains no dependency or permission.
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Blocked: KSP has no release for Kotlin 2.4.x (latest 2.3.12), and its Kotlin-2.2 pairing cannot be
# applied against AGP 9. Kept here so the blocked path and its version are recorded.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
